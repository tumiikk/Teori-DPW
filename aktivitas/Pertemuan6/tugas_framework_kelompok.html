<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tugas framework css</title>

    <!-- Milligram butuh normalize.css sebagai basis -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Anton&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --brand-green: #00923f;
            --brand-green-dark: #00722f;
            --page-bg: #f1faee;
            --ink: #1c2b33;
            --muted: #9aa4ab;
            --border-gray: #ced4da;
            --focus-blue: #86b7fe;
            --focus-blue-soft: rgba(134, 183, 254, .35);
            --required-red: #e6484f;
        }

        html {
            font-size: 62.5%;
        }

        /* 1rem = 10px, biar gampang cocokin ke ukuran px asli */

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--page-bg) 0%, #ffffff 65%);
            font-family: 'Roboto', sans-serif;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        /* ============================================================
     KARTU LOGIN
     Ukuran acuan desain: 1439 x 751 px (diambil dari pengukuran
     piksel gambar referensi). Semua posisi % di bawah dihitung
     dari acuan ini.
  ============================================================ */
        .login-card {
            position: relative;
            width: 100%;
            max-width: 144rem;
            background: #fff;
            border-radius: 1.2rem;
            box-shadow: 0 2rem 5rem rgba(20, 40, 30, 0.14);
            overflow: hidden;
        }

        /* ---------- Mode default (mobile): flow normal, tanpa posisi absolut ---------- */
        .hero-panel {
            padding: 2rem 2rem 0;
        }

        .hero-image {
            position: relative;
            width: 100%;
            aspect-ratio: 806/539;
            /* rasio asli panel foto */
            border-radius: 0.8rem;
            overflow: hidden;
            background:

                url('gambar.png') center/cover no-repeat;
        }

        .hero-caption {
            position: absolute;
            top: 1.8rem;
            left: 1.8rem;
            right: 4rem;
        }

        .hero-caption h1 {
            font-family: 'Anton', sans-serif;
            font-weight: 400;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            line-height: 1.15;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #111;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, .15);
            margin: 0;
        }

        .hero-url {
            position: absolute;
            left: 1.8rem;
            bottom: 1.6rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: #111;
        }

        .form-panel {
            padding: 3rem 3rem 2.4rem;
        }

        .brand-row {
            display: flex;
            align-items: center;
            margin-bottom: 2.4rem;
        }

        .brand-logo {
            width: 5.6rem;
            height: 5.6rem;
            flex: none;
        }

        .brand-divider {
            width: 0.2rem;
            align-self: stretch;
            background: var(--brand-green);
            margin: 0 1.5rem;
            opacity: .6;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 1.3;
            margin: 0;
        }

        .login-form fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }

        .login-form label {
            display: none;
        }

        .field-wrap {
            position: relative;
            margin-bottom: 1.6rem;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            height: 5.2rem;
            border: 0.1rem solid var(--border-gray);
            border-radius: 0.5rem;
            padding-right: 4.4rem;
            font-size: 1.5rem;
        }

        .login-form input:focus {
            border-color: var(--focus-blue);
            box-shadow: 0 0 0 0.3rem var(--focus-blue-soft);
        }

        .required-mark {
            color: var(--required-red);
        }

        .field-icon {
            position: absolute;
            right: 1.6rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .btn-masuk {
            width: 100%;
            height: 5.2rem;
            background: var(--brand-green);
            border-color: var(--brand-green);
            border-radius: 0.5rem;
            font-size: 1.6rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
            margin: 0.6rem 0 0;
        }

        .btn-masuk:hover,
        .btn-masuk:focus {
            background: var(--brand-green-dark);
            border-color: var(--brand-green-dark);
        }

        .helper-text {
            text-align: center;
            font-size: 1.4rem;
            margin: 2.2rem 0 0;
        }

        .divider-dashed {
            border: none;
            border-top: 0.1rem dashed var(--border-gray);
            margin: 2rem 0;
        }

        .credit {
            text-align: center;
        }

        .credit p {
            font-size: 1.3rem;
            margin: 0 0 0.4rem;
        }

        .credit .credit-team {
            font-weight: 700;
            text-decoration: underline;
            color: var(--ink);
        }

        .credit .credit-year {
            color: var(--muted);
            font-size: 1.2rem;
        }

        /* ============================================================
     MODE DESKTOP — replika presisi berbasis pengukuran piksel
     Kartu dikunci ke rasio 1439:751 lalu setiap elemen diposisikan
     absolut memakai persentase dari kotak itu, supaya proporsinya
     identik dengan gambar referensi.
  ============================================================ */
        @media (min-width: 64em) {

            .login-card {
                aspect-ratio: 1439 / 751;
            }

            .hero-panel {
                position: absolute;
                inset: 0;
                width: 63.44%;
                height: 100%;
                padding: 0;
            }

            .hero-image {
                position: absolute;
                left: 1.86%;
                top: 14.38%;
                width: 88.28%;
                height: 71.77%;
                aspect-ratio: auto;
            }

            .hero-caption h1 {
                font-size: clamp(1.8rem, 2.1vw, 2.6rem);
            }

            .form-panel {
                position: absolute;
                left: 67.69%;
                top: 0;
                width: 31.55%;
                height: 100%;
                padding: 0;
            }

            .brand-row {
                position: absolute;
                left: 0;
                top: 8.52%;
                width: 100%;
                margin: 0;
            }

            .brand-title {
                font-size: clamp(1.4rem, 1.15vw, 1.9rem);
            }

            .field-wrap.f-nip {
                position: absolute;
                left: 0;
                top: 27.96%;
                width: 100%;
                height: 11.72%;
                margin: 0;
            }

            .field-wrap.f-pass {
                position: absolute;
                left: 0;
                top: 41.68%;
                width: 100%;
                height: 10.12%;
                margin: 0;
            }

            .field-wrap input {
                height: 100%;
            }

            .btn-masuk {
                position: absolute;
                left: 0;
                top: 56.06%;
                width: 100%;
                height: 9.05%;
                margin: 0;
            }

            .helper-text {
                position: absolute;
                left: 0;
                top: 69.37%;
                width: 100%;
            }

            .divider-dashed {
                position: absolute;
                left: 0;
                top: 78.6%;
                width: 100%;
                margin: 0;
            }

            .credit {
                position: absolute;
                left: 0;
                top: 82.56%;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">

        <!-- Panel kiri: kolase foto -->
        <div class="hero-panel">
            <div class="hero-image">
                <div class="hero-caption">

                </div>
            </div>
        </div>

        <!-- Panel kanan: form login -->
        <div class="form-panel">

            <div class="brand-row">
                <img src="logo.png" class="brand-logo" alt="Logo Universitas Riau">
                <div class="brand-divider"></div>
                <h2 class="brand-title">Sistem Informasi<br>Teknik Elektro &amp;<br>Informatika</h2>
            </div>

            <form class="login-form" action="#" method="post">
                <fieldset>

                    <div class="field-wrap f-nip">
                        <label for="nip_nim">NIP/NIM</label>
                        <input type="text" id="nip_nim" name="nip_nim" placeholder="NIP/NIM *" required>
                    </div>

                    <div class="field-wrap f-pass">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password *" required>
                        <svg class="field-icon" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor"
                                stroke-width="1.5" />
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
                            <line x1="3" y1="21" x2="21" y2="3" stroke="currentColor" stroke-width="1.5" />
                        </svg>
                    </div>

                    <button type="submit" class="button btn-masuk">Masuk</button>

                </fieldset>
            </form>

            <p class="helper-text">
                Belum Punya Akun atau Lupa Password<br>
                (Hubungi Admin Prodi)
            </p>

            <hr class="divider-dashed">

            <div class="credit">
                <p>Dikembangkan oleh:</p>
                <p class="credit-team">TIM PRODI TEKNIK INFORMATIKA</p>
                <p class="credit-year">2026 &copy; SITEI JTE UNRI</p>
            </div>

        </div>
    </div>
</body>

</html>
